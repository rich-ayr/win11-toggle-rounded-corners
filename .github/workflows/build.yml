name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install clang-format
        run: pip install clang-format==22.1.8

      - name: Check formatting
        run: |
          files=$(git ls-files '*.cpp' '*.h' '*.hpp' '*.cc' '*.hh' '*.cxx')
          echo "Checking: $files"
          clang-format --dry-run --Werror $files

  build:
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CXX: clang-cl
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install meson & ninja
        run: pip install meson ninja

      - name: Record toolchain versions
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInfo = if (Test-Path $vswhere) { & $vswhere -latest -products '*' -format text | Out-String } else { '(vswhere not found)' }

          "## Toolchain" | Add-Content $env:GITHUB_STEP_SUMMARY
          "" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- commit: ${{ github.sha }}" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- build date (UTC): $([DateTime]::UtcNow.ToString('o'))" | Add-Content $env:GITHUB_STEP_SUMMARY
          "" | Add-Content $env:GITHUB_STEP_SUMMARY
          '```text' | Add-Content $env:GITHUB_STEP_SUMMARY
          (clang-cl --version 2>&1 | Out-String).Trim() | Add-Content $env:GITHUB_STEP_SUMMARY
          "meson $(meson --version)" | Add-Content $env:GITHUB_STEP_SUMMARY
          "ninja $(ninja --version)" | Add-Content $env:GITHUB_STEP_SUMMARY
          "" | Add-Content $env:GITHUB_STEP_SUMMARY
          $vsInfo.Trim() | Add-Content $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          "" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Build
        run: |
          meson setup build
          meson compile -C build

      - name: Verify reproducibility
        shell: pwsh
        run: |
          $h1 = (Get-FileHash build\win11-toggle-rounded-corners.exe -Algorithm SHA256).Hash
          meson compile -C build --clean
          meson compile -C build
          $h2 = (Get-FileHash build\win11-toggle-rounded-corners.exe -Algorithm SHA256).Hash

          "- pass 1 SHA256: $h1" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- pass 2 SHA256: $h2" | Add-Content $env:GITHUB_STEP_SUMMARY
          "" | Add-Content $env:GITHUB_STEP_SUMMARY

          if ($h1 -ne $h2) {
            Write-Error "Build is NOT reproducible: $h1 != $h2"
            exit 1
          }
          Write-Host "Reproducible build verified: $h1"

      - name: Collect binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item build\win11-toggle-rounded-corners.exe artifacts\

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss'

      - name: Collect installer
        run: Copy-Item build\win11-toggle-rounded-corners-setup.exe artifacts\

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/*.exe

      - uses: actions/upload-artifact@v7
        with:
          name: win11-toggle-rounded-corners
          path: artifacts/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          prev_tag="$(git tag --sort=-creatordate | grep -v "^${tag}$" | head -1)"

          notes="$(git tag -l --format='%(contents:subject)' "$tag")"
          body="$(git tag -l --format='%(contents:body)' "$tag")"
          if [ -n "$body" ]; then
            notes="${notes}"$'\n\n'"${body}"
          fi
          if [ -n "$prev_tag" ]; then
            notes="${notes}"$'\n\n'"**Full Changelog**: https://github.com/${{ github.repository }}/compare/${prev_tag}...${tag}"
          fi

          extra_args=()
          if [[ "$tag" == *-* ]]; then
            extra_args+=(--prerelease)
          fi
          gh release create "$tag" \
            artifacts/win11-toggle-rounded-corners-setup.exe \
            artifacts/win11-toggle-rounded-corners.exe \
            --title "Release $tag" \
            --notes "$notes" \
            "${extra_args[@]}"
